[package]
name = "luatos-flasher"
version = "0.1.0"
description = "LuatOS 烧录器：LuatOS 模组的项目管理、烧录与调试工具"
edition = "2021"
rust-version = "1.90"

[lib]
name = "luatos_flasher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tauri-plugin-shell = "2.6.0"
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
encoding_rs = "0.8.44"
futures-util = "0.3.34"
regex = "1.13.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
serialport = { version = "4.10.1", features = ["usbportinfo-interface"] }
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
sevenz-rust2 = "0.20.2"
mlua = { version = "0.12.2", features = ["lua53", "vendored"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
tauri-plugin-log = "2.10.2"
